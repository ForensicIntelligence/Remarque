name: RemarqueRebuild
options:
  bundleIdPrefix: ca.forensicintelligence
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.remarque
    MARKETING_VERSION: '3.0.0'
    CURRENT_PROJECT_VERSION: '734'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: PATM9DNCLA
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  RemarqueCore:
    path: Packages/RemarqueCore
targets:
  Remarque:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Editor
        type: folder
        buildPhase: resources
      - path: Resources/Templates
        type: folder
        buildPhase: resources
      - path: Resources/Help
        type: folder
        buildPhase: resources
      - path: Resources/ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icns
    dependencies:
      - package: RemarqueCore
    settings:
      base:
        PRODUCT_NAME: Remarque
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Remarque.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
  RemarqueIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/RemarqueIntegrationTests]
    dependencies:
      - target: Remarque
      - package: RemarqueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.remarque.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RemarqueRebuild:
    build:
      targets:
        Remarque: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RemarqueIntegrationTests]
    archive:
      config: Release
